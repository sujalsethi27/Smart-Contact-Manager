</nav>


    <!-- navbar end -->



   <!-- sidebar -->
   <div class="sidebar mt-3">
<span onclick="togglesidebar()" class="crossbtn mt-3">&times;</span>
<ul class="list-unstyled">

    <li>
        <a href="#" th:href="@{/user/index}">
            <i class="fa-solid fa-house" style="margin: 4px;"></i> Home
        </a>
    </li>

    <li>
        <a href="#" th:href="@{/user/show-contact}">
            <i class="fa-solid fa-address-book" style="margin: 4px;"></i> View Contacts
        </a>
    </li>

    <li>
        <a href="#" th:href="@{/user/add-contact}">
            <i class="fa-solid fa-user-plus" style="margin: 4px;"></i> Add Contact
        </a>
    </li>

    <li>
        <a href="#" th:href="@{/user/profile}">
            <i class="fa-solid fa-user" style="margin: 4px;" ></i> Your Profile
        </a>
    </li>

    <li>
        <a href="#" th:href="@{/logout}">
            <i class="fa-solid fa-right-from-bracket" style="margin: 4px;"></i> Logout
        </a>
    </li>

</ul>

   <div class="divider"></div>
   </div>
    <!-- sidebar end -->


    <!-- content insert here  -->
 <div class="content mt-3">

  <span class="toggle-btn mt-4" onclick="toggleSidebar()">
    <i onclick="togglesidebar()" class="fa fa-bars"></i>
  </span>

  <div th:if="${session.message}" class="container">
  <div th:classappend="${'alert-'+session.message.type}" class="alert text-center" role="alert">
    <span th:text="${session.message.content}"></span>
</div>
<th:block th:text="${@sessionhelper.removemessage()}"></th:block>
</div>

        <div th:replace="${content}"></div>
    </div>


    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: jQuery and Bootstrap Bundle (includes Popper) -->

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
     <script th:src="@{/js/script.js}"></script>
     <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>


     <script>
   function deleteContact(cid) {

  console.log("Deleting contact id:", cid); // 👈 MUST SHOW NUMBER

  const swalWithBootstrapButtons = Swal.mixin({
    customClass: {
      confirmButton: "btn btn-success",
      cancelButton: "btn btn-danger"
    },
    buttonsStyling: false
  });

  Swal.fire({
  title: "Are you sure?",
  text: "You won't be able to revert this!",
  icon: "warning",
  showCancelButton: true,
  confirmButtonColor: "#3085d6",
  cancelButtonColor: "#d33",
  confirmButtonText: "Yes, delete it!"
}).then((result) => {
  if (result.isConfirmed) {
          window.location.href = "/user/delete/" + cid;
    Swal.fire({
      title: "Deleted!",
      text: "Your file has been deleted.",
      icon: "success"
    });
  }
});
}

     </script>
