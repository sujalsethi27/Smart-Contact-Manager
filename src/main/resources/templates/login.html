<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="base :: layout(~{::section})">
<head>
    <title>Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section>
 <div id="login">
        <div class="container ">
            <div id="login-row" class="row justify-content-center align-items-center">
                <div id="login-column" class="col-md-6">
                    <div id="login-box" class="col-md-12 ">
                    <form th:action="@{/do_login}" method="post">
                            <h3 class="text-center text-info">Login</h3>

                          <div th:if="${param.error}" class="alert alert-danger">
    Invalid Username or Password
</div>
<div th:if="${param.logout}" 
     class="alert alert-success text-center">
    Logged out successfully
</div>
                            <div class="form-group">
                                <label for="username" class="text-info">Username:</label><br>
                                <input type="text" name="email" id="email" class="form-control" 
       placeholder="Enter your mail id"
       required>
                            </div>
                            <div class="form-group">
                                <label for="password" class="text-info">Password:</label><br>
<input type="password"
       name="password"
       class="form-control"
       id="password_field"
       placeholder="Enter password"
       autocomplete="new-password"
       required
/>
                            </div>
                            <div class="form-group ">
                                <label for="remember-me" class="text-info"><span>Remember me</span> <span><input id="remember-me" name="remember-me" type="checkbox"></span></label><br>
                                <input type="submit" name="submit" class="btn btn-info btn-md" value="submit">
                            </div>
                            <div id="register-link" class="text-right">
                                <a href="/signup" class="text-info">Register here</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
</body>
</html>


<!-- When the login form is submitted, the POST request is sent to /do_login.
 This request is intercepted by Spring Security (not by any controller)
 because loginProcessingUrl("/do_login") is configured. Spring Security
 extracts the username and password, calls UserDetailsService to load
 the user from the database, and verifies the password using
 PasswordEncoder. If authentication is successful, Spring Security
 stores the authenticated user in the SecurityContext and HTTP session,
 and then automatically redirects the user to the defaultSuccessUrl
 (/user/index). No explicit login controller method is required. -->
